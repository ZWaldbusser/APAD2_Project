{
  "swagger": "2.0",
  "info": {
    "title": "Hardware Management API",
    "version": "v1",
    "description": "Hardware management service contract (gRPC), exposed here in gRPC-over-HTTP form: every RPC is POST /hardware.v1.<Service>/<Method> with the request message as the JSON body. int64 values are JSON strings.\n\n**Conventions**\n- Every mutating RPC takes a caller-chosen unique `requestId` (or the `idempotency-key` header; if both are sent they must match). Repeating a requestId with the same fields returns the original response and changes nothing; with different fields it fails with ALREADY_EXISTS.\n- Authenticate with the `authorization` header: `Basic base64(team:code)` for service teams, or `Bearer <token>` from AuthService.Login for the website.\n- Scalar request fields are optional where zero/false is a meaningful value. A missing required field fails with INVALID_ARGUMENT.\n\n**Status codes**\n- UNAUTHENTICATED: missing or wrong credentials\n- PERMISSION_DENIED: the caller's team may not call this RPC\n- INVALID_ARGUMENT: a field is missing or invalid\n- NOT_FOUND: unknown hardware id or checkout id\n- FAILED_PRECONDITION: a stock rule would be broken (e.g. not enough reserved stock)\n- ABORTED: stale expectedVersion, or a concurrent change; refresh and retry\n- ALREADY_EXISTS: duplicate asset tag, or requestId reused with different fields\n- RESOURCE_EXHAUSTED: too many failed sign-in attempts; wait five minutes\n- UNAVAILABLE: storage temporarily unavailable; resend the same requestId"
  },
  "tags": [
    {
      "name": "HardwareService"
    },
    {
      "name": "AuthService"
    },
    {
      "name": "OpsService"
    }
  ],
  "consumes": [
    "application/json"
  ],
  "produces": [
    "application/json"
  ],
  "securityDefinitions": {
    "basicAuth": {
      "type": "basic",
      "description": "Basic base64(team:code) for service teams."
    },
    "bearerAuth": {
      "type": "apiKey",
      "name": "Authorization",
      "in": "header",
      "description": "Enter: Bearer <token> (from AuthService.Login)."
    }
  },
