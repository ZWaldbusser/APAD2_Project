  "definitions": {
    "Hardware": {
      "type": "object",
      "properties": {
        "id": {
          "type": "string"
        },
        "name": {
          "type": "string"
        },
        "category": {
          "type": "string"
        },
        "description": {
          "type": "string"
        },
        "assetTag": {
          "type": "string"
        },
        "serial": {
          "type": "string"
        },
        "status": {
          "type": "string",
          "description": "active | damaged | under_maintenance | retired"
        },
        "total": {
          "type": "string",
          "format": "int64",
          "description": "Units owned, including units checked out."
        },
        "reserved": {
          "type": "string",
          "format": "int64",
          "description": "Units allocated to projects (checked out or not)."
        },
        "out": {
          "type": "string",
          "format": "int64",
          "description": "Units checked out right now. NOT 'out of stock'."
        },
        "version": {
          "type": "string",
